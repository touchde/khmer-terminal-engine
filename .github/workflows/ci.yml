name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install a Khmer font (Linux) for shaper tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-khmeros-core
          echo "KTE_TEST_FONT=$(fc-list : file | grep -i khmeros | head -1 | cut -d: -f1)" >> "$GITHUB_ENV"
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - run: cargo check --workspace --all-targets

  deny:
    name: cargo-deny (licenses, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  spec:
    name: spec reference agrees with corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/spec-ref/kte_spec_ref.py --check

  c-abi:
    name: C API demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p kte-capi --release
      - name: Compile and run examples/c/demo.c
        run: |
          LIBS=""
          if [ "$RUNNER_OS" = "Linux" ]; then LIBS="-lpthread -ldl -lm"; fi
          cc -Wall -Wextra -Werror examples/c/demo.c -Iinclude target/release/libkte_capi.a $LIBS -o kte-demo
          ./kte-demo

  wasm:
    name: WebAssembly build + Node smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p kte-capi --release --target wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tests/wasm/smoke.mjs

  kte-term:
    name: kte-term snapshots (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-khmeros-core
          echo "KTE_KHMER_FONT=$(fc-list : file | grep -i khmeros | head -1 | cut -d: -f1)" >> "$GITHUB_ENV"
      - run: cargo build -p kte-term --release
      - name: Render snapshots
        shell: bash
        run: |
          bin=target/release/kte-term
          mkdir -p snapshots
          text=$'សួស្តី ពិភពលោក! Hello, world!\nខ្ញុំស្រឡាញ់ការសរសេរកម្មវិធី\nព្រះរាជាណាចក្រកម្ពុជា'
          for model in wide legacy compact; do
            "$bin" --snapshot "snapshots/$model.png" --model "$model" --rows 4 --cols 50 --text "$text"
            test -s "snapshots/$model.png"
          done
      - name: Live shell snapshot (type Khmer into bash)
        if: runner.os != 'Windows'
        run: |
          target/release/kte-term --snapshot snapshots/live-bash.png --rows 4 --cols 50 \
            --command 'PS1="bash$ " bash --norc -i' --type 'echo សួស្តី ពិភពលោក\nខ្ញុំស្រឡាញ់' --wait-ms 15000 --dump
          test -s snapshots/live-bash.png
      - uses: actions/upload-artifact@v7
        with:
          name: kte-term-snapshots-${{ matrix.os }}
          path: snapshots/

