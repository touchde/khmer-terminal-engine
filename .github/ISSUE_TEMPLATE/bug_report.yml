name: Bug report
description: A bug in KTE code (crash, wrong result, build failure)
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KTE version or commit
  - type: input
    id: env
    attributes:
      label: OS and Rust version
