name: Khmer rendering issue
description: Khmer text displays or behaves incorrectly in a terminal
labels: [rendering, triage]
body:
  - type: textarea
    id: text
    attributes:
      label: Text
      description: Paste the exact text that breaks (copy it, don't retype).
      render: text
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      description: Gap, clipped subscript, wrong vowel position, cursor drift, broken backspace, selection or copy problem…
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here. If you can, include the same text rendered correctly (e.g. in a browser) for comparison.
  - type: input
    id: terminal
    attributes:
      label: Terminal and version
      placeholder: e.g. Windows Terminal 1.22, VS Code 1.105 integrated terminal, kte-term 0.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: font
    attributes:
      label: Font(s)
      placeholder: e.g. JetBrains Mono + Noto Sans Khmer fallback
  - type: input
    id: app
    attributes:
      label: Application inside the terminal
      placeholder: e.g. zsh 5.9, vim, tmux 3.5, cat
