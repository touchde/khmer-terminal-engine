[package]
name = "kte-term"
description = "The standalone Khmer Terminal Engine terminal emulator (reference implementation)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
arboard = { version = "3", default-features = false }
harfrust.workspace = true
kte-core.workspace = true
portable-pty = "0.9"
softbuffer = "0.4"
tiny-skia = "0.11"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }

[lints]
workspace = true
